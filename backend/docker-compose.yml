services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: stayq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: stayq_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stayq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayq -d stayq_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stayq_pgdata:
