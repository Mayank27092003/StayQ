name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Install CocoaPods
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/ios/iphoneos
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (.ipa)
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/ios/iphoneos
          flutter build ios --release --no-codesign

      - name: Package Payload as .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r StayQ-Release.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StayQ-iOS-Release
          path: build/ios/iphoneos/StayQ-Release.ipa
