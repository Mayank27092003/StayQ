name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Experimental Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter & Pod Dependencies
        run: |
          flutter --version
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (Release Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload as IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r StayQ-Release.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StayQ-iOS-Release
          path: build/ios/iphoneos/StayQ-Release.ipa
          retention-days: 14

      - name: Publish Direct Public Release Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-ios-latest
          name: "Stay Q iOS Release IPA (Direct Download)"
          body: "Official unsigned Stay Q iOS IPA build. Ready for AltStore, Sideloadly, 3uTools, and TestFlight."
          files: build/ios/iphoneos/StayQ-Release.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
