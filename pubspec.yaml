name: stay_q
description: "Stay Q Luxury Stays & Experiences Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: any
  flutter_animate: any
  provider: any
  intl: any
  smooth_page_indicator: any
  lottie: any
  rive: any
  flutter_svg: any
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  cloud_functions: any
  firebase_messaging: any
  shared_preferences: any
  google_sign_in: any
  pinput: any
  intl_phone_field: any
  flutter_riverpod: any
  http: any
  cached_network_image: any
  shimmer: any
  google_maps_flutter: any
  syncfusion_flutter_datepicker: any
  image_picker: any
  firebase_storage: any
  url_launcher: any
  geolocator: any
  video_player: any
  google_mlkit_text_recognition: any
  socket_io_client: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/experiences/
    - assets/lottie/
